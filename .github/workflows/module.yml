# KernelSU module ZIP build (module/build.sh), separate from release.yaml.
#
# Pattern mirrored from thoitiettxl-cyber/cli-proxy-api (template of
# module/): that repo has no CI; its maintainer runs build.sh on a host
# and publishes exactly two Release assets, the module ZIP and its
# `.zip.sha256`. This workflow automates the same build + publish.
#
# Modes (single predicate, `steps.mode.outputs.release`):
#   pull_request (module/** or this file) -> build with the tracked
#     sources.lock unchanged, upload a run artifact. Publishes nothing.
#   workflow_dispatch, empty `tag`        -> same as pull_request.
#   push tag v* / release published / workflow_dispatch with `tag`
#     -> release mode: wait for that EXISTING release's
#     castctl_<ver>_linux_arm64.tar.gz + checksums.txt (release.yaml
#     uploads them), verify the archive sha256 against checksums.txt,
#     point the LOCK_CASTCTL_* lines of the workspace copy of
#     sources.lock at that asset (not committed; the re-pinned lock
#     is saved as castctl-module_<ver>.sources.lock + .sha256
#     alongside the ZIP, so the exact pinned inputs of a release
#     build stay reviewable — sources.lock is NOT staged inside
#     the ZIP), set module.prop to the tag, build, then upload
#     castctl-module_<ver>.zip and castctl-module_<ver>.zip.sha256.
#     checksums.txt is never touched.
#     This workflow never creates tags or releases.
#
# glibc + CA stay pinned by sources.lock; build.sh verifies every
# download by sha256 and fails on mismatch. Builds run on a native
# arm64 runner so build.sh's loader preflight actually executes
# `castctl --version` through the bundled glibc loader.
#
# Note: releases created by release.yaml with GITHUB_TOKEN do not fire
# `release` events, hence the tag-push trigger plus asset polling.
name: module

on:
  pull_request:
    paths:
      - 'module/**'
      - '.github/workflows/module.yml'
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the module ZIP to (e.g. v0.7.0). Empty = build from tracked sources.lock, artifact only.'
        type: string
        default: ''
        required: false

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}

concurrency:
  group: "module-${{ github.event_name == 'pull_request' && github.ref || github.event.release.tag_name || inputs.tag || github.ref_name }}"
  cancel-in-progress: false

jobs:
  lint:
    name: shellcheck module scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: shellcheck
        shell: bash
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck --version | head -2
          shellcheck -S warning -s bash module/build.sh
          # Excluded for the Android scripts (intentional, runtime unchanged):
          # SC2034 KernelSU installer vars (SKIPUNZIP, SKIPMOUNT, ...) read by
          # the framework; SC3028 ${RANDOM:-0} is guarded for mksh/ash;
          # SC2209 `contention=wait` assigns the literal string.
          shellcheck -S warning -s sh -e SC2034,SC3028,SC2209 module/customize.sh module/service.sh \
            module/action.sh module/uninstall.sh module/scripts/castctl-ctl
          # Bootloop-safety invariants: no early-boot stages or
          # sepolicy/system overlays in the module source tree.
          for f in post-fs-data.sh post-mount.sh boot-completed.sh sepolicy.rule system.prop; do
            if [ -e "module/$f" ]; then echo "forbidden module file: module/$f" >&2; exit 1; fi
          done
          if [ -d module/system ]; then echo "forbidden module/system overlay" >&2; exit 1; fi

  build:
    name: build module ZIP
    runs-on: ubuntu-24.04-arm
    needs: lint
    outputs:
      release: ${{ steps.mode.outputs.release }}
      tag: ${{ steps.mode.outputs.tag }}
      asset: ${{ steps.pack.outputs.asset }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Resolve mode
        id: mode
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REL_TAG: ${{ github.event.release.tag_name }}
          IN_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag=
          case "$EVENT" in
            push) [ "$GITHUB_REF_TYPE" = tag ] && tag=$GITHUB_REF_NAME ;;
            release) tag=$REL_TAG ;;
            workflow_dispatch) tag=$IN_TAG ;;
          esac
          if [ -n "$tag" ]; then
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "invalid tag: $tag" >&2; exit 1; }
            echo release=true >>"$GITHUB_OUTPUT"
          else
            echo release=false >>"$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "mode: release=${tag:+true} tag=${tag:-<none>}"
      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q binutils curl ripgrep zip unzip
      - name: Pin core to the release's own arm64 glibc asset
        if: ${{ steps.mode.outputs.release == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.mode.outputs.tag }}
        run: |
          set -euo pipefail
          ver=${TAG#v}
          core=castctl_${ver}_linux_arm64.tar.gz
          noplugin=castctl_${ver}_linux_arm64_no-plugin.tar.gz
          gh release view "$TAG" --json tagName >/dev/null || { echo "release $TAG does not exist; this workflow never creates releases" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/rel"
          # release.yaml uploads checksums.txt last; wait up to 45 min.
          for i in $(seq 1 90); do
            names=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            if grep -qx checksums.txt <<<"$names" && grep -qx "$core" <<<"$names" && \
               gh release download "$TAG" --pattern checksums.txt --dir "$RUNNER_TEMP/rel" --clobber && \
               grep -q "  $core\$" "$RUNNER_TEMP/rel/checksums.txt"; then
              break
            fi
            [ "$i" = 90 ] && { echo "timed out waiting for $core + checksums.txt on $TAG" >&2; exit 1; }
            sleep 30
          done
          gh release download "$TAG" --pattern "$core" --dir "$RUNNER_TEMP/rel" --clobber
          sum=$(awk -v f="$core" '$2==f {print $1}' "$RUNNER_TEMP/rel/checksums.txt")
          np_sum=$(awk -v f="$noplugin" '$2==f {print $1}' "$RUNNER_TEMP/rel/checksums.txt")
          [[ "$sum" =~ ^[0-9a-f]{64}$ && "$np_sum" =~ ^[0-9a-f]{64}$ ]] || { echo "checksums.txt lacks $core/$noplugin" >&2; exit 1; }
          (cd "$RUNNER_TEMP/rel" && echo "$sum  $core" | sha256sum -c -) || { echo "checksum mismatch for $core" >&2; exit 1; }
          base=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}
          lock=module/sources.lock
          sed -i \
            -e "s|^LOCK_CASTCTL_VERSION=.*|LOCK_CASTCTL_VERSION=${ver}|" \
            -e "s|^LOCK_CASTCTL_ARCHIVE=.*|LOCK_CASTCTL_ARCHIVE=${core}|" \
            -e "s|^LOCK_CASTCTL_URL=.*|LOCK_CASTCTL_URL=${base}/${core}|" \
            -e "s|^LOCK_CASTCTL_SHA256=.*|LOCK_CASTCTL_SHA256=${sum}|" \
            -e "s|^LOCK_CASTCTL_NOPLUGIN_ARCHIVE=.*|LOCK_CASTCTL_NOPLUGIN_ARCHIVE=${noplugin}|" \
            -e "s|^LOCK_CASTCTL_NOPLUGIN_URL=.*|LOCK_CASTCTL_NOPLUGIN_URL=${base}/${noplugin}|" \
            -e "s|^LOCK_CASTCTL_NOPLUGIN_SHA256=.*|LOCK_CASTCTL_NOPLUGIN_SHA256=${np_sum}|" \
            "$lock"
          printf '\n# CI: LOCK_CASTCTL_* re-pinned to release %s (sha256 from its checksums.txt).\n' "$TAG" >>"$lock"
          grep -c "^LOCK_CASTCTL_SHA256=${sum}\$" "$lock" | grep -qx 1
          # Same scheme as module.prop (0.6.4 -> 60400): MMmmpp00.
          IFS=. read -r ma mi pa <<<"${ver%%-*}"
          sed -i -e "s|^version=.*|version=${TAG}|" \
            -e "s|^versionCode=.*|versionCode=$((ma*1000000 + mi*10000 + pa*100))|" module/module.prop
          git diff --stat
          git diff module/module.prop
      - name: Build
        shell: bash
        env:
          CASTCTL_MODULE_OUT_DIR: ${{ runner.temp }}/dist
        run: |
          set -euo pipefail
          bash module/build.sh | tee "$RUNNER_TEMP/build.log"
          grep -qx 'Loader preflight: executed' "$RUNNER_TEMP/build.log" || { echo "loader preflight did not execute" >&2; exit 1; }
      - name: Rename, checksum and inspect ZIP
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          dist=$RUNNER_TEMP/dist
          src=$(ls "$dist"/castctl_ksu_*.zip)
          case "$src" in *UNATTESTED*) echo "unattested build refused" >&2; exit 1 ;; esac
          mv_ver=$(sed -n 's/^version=v\{0,1\}//p' module/module.prop)
          asset=castctl-module_${mv_ver}.zip
          mkdir -p out
          cp "$src" "out/$asset"
          (cd out && sha256sum "$asset" >"$asset.sha256" && sha256sum -c "$asset.sha256")
          list=$(unzip -Z1 "out/$asset")
          for f in module.prop customize.sh service.sh action.sh uninstall.sh \
            scripts/castctl-ctl webroot/index.html config.json.example \
            ui/index.html ui/ui.sha256 \
            licenses/GLIBC-COPYING.LESSERv2 licenses/LICENSE licenses/LICENSE.sing-box licenses/NOTICE licenses/THIRD_PARTY_NOTICES.md \
            payload/bin/castctl payload/lib/ld-linux-aarch64.so.1 payload/lib/libc.so.6 payload/lib/libresolv.so.2 payload/lib/libpthread.so.0 \
            payload/ca/cert.pem payload/checksums.sha256 payload/runtime.version \
            META-INF/com/google/android/update-binary; do
            grep -qx "$f" <<<"$list" || { echo "missing in ZIP: $f" >&2; exit 1; }
          done
          if grep -Eq '(^|/)(post-fs-data\.sh|post-mount\.sh|sepolicy\.rule|system\.prop|config\.json|sources\.lock|payload-manifest\.txt|config\.example\.json)$|^system/|^docs/|^payload/lib/libdl\.so\.2$|^(LICENSE|LICENSE\.sing-box|NOTICE|THIRD_PARTY_NOTICES\.md)$' <<<"$list"; then
            echo "forbidden file in ZIP" >&2; exit 1
          fi
          # Release mode: save the re-pinned sources.lock alongside
          # the ZIP (it is not staged inside the ZIP). PR builds
          # use the tracked lock unchanged and save nothing.
          if [ -n "${{ steps.mode.outputs.tag }}" ]; then
            cp module/sources.lock "out/castctl-module_${mv_ver}.sources.lock"
            (cd out && sha256sum "castctl-module_${mv_ver}.sources.lock" >"castctl-module_${mv_ver}.sources.lock.sha256" && sha256sum -c "castctl-module_${mv_ver}.sources.lock.sha256")
          fi
          unzip -p "out/$asset" payload/runtime.version
          echo "asset=$asset" >>"$GITHUB_OUTPUT"
          ls -l out; cat out/*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: castctl-module
          path: out/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: attach ZIP to release
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.outputs.release == 'true' }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: castctl-module
          path: out
      - name: Verify and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          ASSET: ${{ needs.build.outputs.asset }}
        run: |
          set -euo pipefail
          [ "$ASSET" = "castctl-module_${TAG#v}.zip" ] || { echo "asset $ASSET does not match tag $TAG" >&2; exit 1; }
          (cd out && sha256sum -c "$ASSET.sha256")
          gh release upload "$TAG" "out/$ASSET" "out/$ASSET.sha256" --clobber
          mkdir -p back
          gh release download "$TAG" --pattern "$ASSET*" --dir back
          (cd back && sha256sum -c "$ASSET.sha256")
          cmp back/"$ASSET" out/"$ASSET"
          lock="castctl-module_${TAG#v}.sources.lock"
          if [ -f "out/$lock" ]; then
            (cd out && sha256sum -c "$lock.sha256")
            gh release upload "$TAG" "out/$lock" "out/$lock.sha256" --clobber
            mkdir -p back-lock
            gh release download "$TAG" --pattern "$lock*" --dir back-lock
            (cd back-lock && sha256sum -c "$lock.sha256")
            cmp "back-lock/$lock" "out/$lock"
          fi
