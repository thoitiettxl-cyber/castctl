# Release builds: Linux amd64/arm64, glibc + _no-plugin static.
#
# Publication rule (the single shared predicate, written out literally
# at release creation, at every `gh release upload` step, and at the
# checksums job: the checksums upload step itself carries only
# `if: success()` and is gated by its job's `if:`):
#
#   github.ref_type == 'tag'
#   || (github.event_name == 'workflow_dispatch' && inputs.publish != 'none')
#
# A tag push publishes. A workflow_dispatch run publishes NOTHING
# unless its `publish` input explicitly requests `draft` or
# `prerelease`; the default (`none`) is a dry run: builds and gates
# run, every publish step is skipped. Supplying `tag_name` alone,
# without `publish != 'none'`, publishes nothing.
#
# A pull_request run publishes NOTHING: github.event_name is
# 'pull_request', so the second disjunct is false, and
# github.ref_type is 'branch' on a PR, so the first disjunct is
# false too. Builds and gates still run (the build jobs' if:
# treats a skipped prepare as a dry run); every release-creation
# and upload step is skipped by the same predicate.
#
# `permissions: contents: write` is static and cannot be conditioned
# on the event or inputs. It grants the token the capability; the
# `if:` conditions are the enforcement. Do not cite permissions as
# proof that a dry run publishes nothing — audit the `if:`s.
#
# No Actions artifact storage is used anywhere in this file (quota
# exhausted): assets go straight to the GitHub Release with
# `gh release upload`, and the checksums job downloads them back
# from the Release with `gh release download`. There is no
# artifact upload/download step of any kind.
#
# Adapted from CLIProxyAPI's release workflow at commit
# 90c447d3a8727d115aa7552ec93ce023736ed492 (see docs/provenance.md
# section 2 for the mapping and deviations). Deltas from upstream:
# Go version from this repo's go.mod (never upstream's 1.26.10);
# asset token `arm64` (never `aarch64`); `-trimpath` and canonical
# build tags added; no model-catalog refresh (castctl has none);
# no FreeBSD/hosted jobs; archives carry LICENSE + LICENSE.sing-box
# + NOTICE + README.md; checksums are a single success-only final job.
name: release

on:
  push:
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this run? none = dry-run only (build + gates, no release, no upload). draft = create a draft release and upload assets. prerelease = create a prerelease and upload assets.'
        type: choice
        options: [none, draft, prerelease]
        default: 'none'
        required: false
      tag_name:
        description: 'Release tag for draft/prerelease (e.g. v0.6.2). Required when publish is not none; ignored when publish is none.'
        type: string
        default: ''
        required: false

permissions:
  contents: write

# `gh` needs repository context: it resolves the repository from
# GH_REPO when the workspace has no `.git`. The prepare and
# checksums jobs also run actions/checkout, which provides the same
# context from the git remote; both routes are kept so neither job
# depends on exactly one of them.
env:
  GH_REPO: ${{ github.repository }}

# Serialize publish runs to the same effective tag so concurrent
# runs cannot interleave --clobber uploads and checksums downloads.
# Effective tag: the pushed tag on a tag push; inputs.tag_name on a
# dispatch publish. Dry runs (publish=none, or an empty tag_name)
# fall back to a per-run group so they never queue behind, or
# block, a real publish run.
concurrency:
  group: "release-${{ github.ref_type == 'tag' && github.ref_name || github.event_name == 'workflow_dispatch' && inputs.publish != 'none' && inputs.tag_name || format('dry-run-{0}-{1}', github.ref_name, github.run_id) }}"
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare release
    runs-on: ubuntu-latest
    if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish != 'none') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Derive release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            PUBLISH_MODE="release"
          else
            RELEASE_TAG="${INPUT_TAG_NAME}"
            PUBLISH_MODE="${INPUT_PUBLISH}"
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: ${RELEASE_TAG} (expected vX.Y.Z[-suffix])" >&2
            exit 1
          fi
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "mode=${PUBLISH_MODE}" >> "${GITHUB_OUTPUT}"
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
      - name: Create release if absent (idempotent)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          PUBLISH_MODE: ${{ steps.tag.outputs.mode }}
        run: |
          set -euo pipefail
          # Validate the publish mode before any gh call: an
          # out-of-choice value must fail closed on both the
          # reuse and the create path, never fall through to a
          # full published release.
          case "${PUBLISH_MODE}" in
            draft|prerelease|release) ;;
            *)
              echo "unknown PUBLISH_MODE: ${PUBLISH_MODE}" >&2
              exit 1
              ;;
          esac
          if existing="$(gh release view "${RELEASE_TAG}" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"' 2>/dev/null)"; then
            if [[ ! "${existing}" =~ ^(true|false)\ (true|false)$ ]]; then
              echo "unexpected gh release view output for ${RELEASE_TAG}; refusing to reuse release" >&2
              exit 1
            fi
            read -r is_draft is_prerelease <<< "${existing}"
            # Reuse only on an exact mode match; a mismatch fails
            # closed instead of silently mutating a release of a
            # different kind (e.g. --clobber uploads onto a published
            # release from a draft dispatch).
            case "${PUBLISH_MODE}" in
              draft)
                if [[ "${is_draft}" != "true" ]]; then
                  echo "release ${RELEASE_TAG} already exists but is not a draft (isDraft=${is_draft}, isPrerelease=${is_prerelease}); refusing to reuse it for a draft publish" >&2
                  exit 1
                fi
                ;;
              prerelease)
                if [[ "${is_prerelease}" != "true" || "${is_draft}" == "true" ]]; then
                  echo "release ${RELEASE_TAG} already exists but is not a prerelease (isDraft=${is_draft}, isPrerelease=${is_prerelease}); refusing to reuse it for a prerelease publish" >&2
                  exit 1
                fi
                ;;
              release)
                if [[ "${is_draft}" != "false" || "${is_prerelease}" != "false" ]]; then
                  echo "release ${RELEASE_TAG} already exists but is not a published release (isDraft=${is_draft}, isPrerelease=${is_prerelease}); refusing to reuse it for a tag-push publish" >&2
                  exit 1
                fi
                ;;
              *)
                echo "unknown PUBLISH_MODE: ${PUBLISH_MODE}" >&2
                exit 1
                ;;
            esac
            echo "release ${RELEASE_TAG} already exists with matching mode (isDraft=${is_draft}, isPrerelease=${is_prerelease}); reusing (uploads use --clobber)"
            exit 0
          fi
          flags=()
          if [[ "${PUBLISH_MODE}" == "draft" ]]; then flags+=(--draft); fi
          if [[ "${PUBLISH_MODE}" == "prerelease" ]]; then flags+=(--prerelease); fi
          # Tag push => neither flag => full release.
          # --target pins a newly created tag to the dispatched
          # commit; without it gh creates the tag from the default
          # branch's HEAD instead.
          gh release create "${RELEASE_TAG}" --target "${GITHUB_SHA}" --title "${RELEASE_TAG}" --generate-notes "${flags[@]}"

  build-linux-glibc:
    name: build linux-${{ matrix.goarch }} glibc
    runs-on: ${{ matrix.runner }}
    needs: prepare
    # always() so a dry run (prepare skipped) still builds, while a
    # failed prepare fail-closes publishing: no build runs against
    # a release that could not be created.
    if: ${{ always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            goarch: amd64
            asset_arch: amd64
            image: quay.io/pypa/manylinux2014_x86_64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            goarch: arm64
            asset_arch: arm64
            image: quay.io/pypa/manylinux2014_aarch64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          # Go module/build cache only. Cache is NOT artifact storage:
          # nothing is stored as a downloadable run artifact and no
          # release asset is produced through it.
          cache: true
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          # inputs.* exist only on workflow_dispatch (and
          # workflow_call, which this workflow has no trigger
          # for). On any other event they expand empty; force
          # the dry-run values explicitly instead of relying on
          # that empty expansion plus the -n check in the elif
          # below.
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            INPUT_PUBLISH="none"
            INPUT_TAG_NAME=""
          fi
          # Reproducible-archive mtime: the commit time of HEAD
          # (fetch-depth: 0 in both build jobs, so the history
          # is present). No SOURCE_DATE_EPOCH is set anywhere
          # in the repo or by the runner; derive it, do not
          # invent it. Fail closed if it is not numeric.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)"
          if [[ ! "${SOURCE_DATE_EPOCH}" =~ ^[0-9]+$ ]]; then
            echo "could not derive SOURCE_DATE_EPOCH from commit time" >&2
            exit 1
          fi
          echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" >> "${GITHUB_ENV}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
            RELEASE_TAG="${GITHUB_REF_NAME}"
          elif [[ "${INPUT_PUBLISH}" != "none" && -n "${INPUT_TAG_NAME}" ]]; then
            RELEASE_VERSION="${INPUT_TAG_NAME#v}"
            RELEASE_TAG="${INPUT_TAG_NAME}"
          else
            # Dry-run: never a real version. Real versions are X.Y.Z
            # derived from vX.Y.Z tags and never contain "dispatch";
            # dry-run archives are never uploaded either.
            RELEASE_VERSION="0.0.0-dispatch-$(git rev-parse --short HEAD)"
            RELEASE_TAG=""
          fi
          # Defense in depth: repeat prepare's tag-format validation
          # for the effective tag. The dry-run branch sets
          # RELEASE_TAG="" and must NOT be validated (an empty
          # tag_name with publish=none takes the dry-run version
          # path above).
          if [[ -n "${RELEASE_TAG}" ]]; then
            if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "invalid release tag: ${RELEASE_TAG} (expected vX.Y.Z[-suffix])" >&2
              exit 1
            fi
          fi
          {
            echo "RELEASE_VERSION=${RELEASE_VERSION}"
            echo "RELEASE_TAG=${RELEASE_TAG}"
            echo "COMMIT=$(git rev-parse --short HEAD)"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "${GITHUB_ENV}"
        env:
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
      - name: Derive Go version from go.mod
        shell: bash
        run: |
          set -euo pipefail
          GO_VERSION="$(sed -n 's/^go \([0-9.]*\)$/\1/p' go.mod)"
          if [[ -z "${GO_VERSION}" ]]; then
            echo "could not parse go version from go.mod" >&2
            exit 1
          fi
          echo "GO_VERSION=${GO_VERSION}" >> "${GITHUB_ENV}"
      - name: Build in manylinux container
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOARCH: ${{ matrix.goarch }}
          MANYLINUX_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          rm -rf "dist/${TARGET}"
          mkdir -p "dist/${TARGET}/archive"
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -e TARGET -e GO_VERSION -e GOARCH -e RELEASE_VERSION -e COMMIT -e BUILD_DATE \
            "$MANYLINUX_IMAGE" \
            bash -euo pipefail -c '
              archive_dir="dist/${TARGET}/archive"
              go_archive="go${GO_VERSION}.linux-${GOARCH}.tar.gz"
              curl -fsSL "https://go.dev/dl/${go_archive}" -o "/tmp/${go_archive}"
              rm -rf /usr/local/go
              tar -C /usr/local -xzf "/tmp/${go_archive}"
              export PATH="/usr/local/go/bin:${PATH}"
              CGO_ENABLED=1 GOOS=linux GOARCH="${GOARCH}" go build -buildvcs=false -trimpath \
                -tags with_utls,with_quic,with_wireguard,with_gvisor \
                -ldflags="-s -w -X github.com/thoitiettxl-cyber/castctl/internal/commands.Version=${RELEASE_VERSION} -X github.com/thoitiettxl-cyber/castctl/internal/commands.Commit=${COMMIT} -X github.com/thoitiettxl-cyber/castctl/internal/commands.BuildDate=${BUILD_DATE}" \
                -o "$archive_dir/castctl" ./cmd/castctl/
              # Stamping verification: `go build -X` to a nonexistent
              # var exits 0 and silently drops the assignment, so
              # verify the stamped version and commit in the
              # just-built binary before any gate or upload.
              version_output="$("$archive_dir/castctl" --version)"
              if ! printf "%s\n" "${version_output}" | grep -Fq "castctl ${RELEASE_VERSION} (${COMMIT} "; then
                echo "stamping verification failed: got ${version_output}, expected castctl ${RELEASE_VERSION} (${COMMIT} ...)" >&2
                exit 1
              fi
              echo "stamping verified: ${version_output}"
              # readelf must exist: without it the gate below would
              # silently pass on an empty version list.
              command -v readelf >/dev/null || { echo "readelf not found in container" >&2; exit 1; }
              glibc_versions="$(readelf --version-info "$archive_dir/castctl" | sed -n "s/.*Name: GLIBC_\([0-9.]*\).*/\1/p" | sort -Vu)"
              if [[ -z "${glibc_versions}" ]]; then
                echo "glibc gate: no GLIBC versions found in binary (expected a dynamic glibc link)" >&2
                exit 1
              fi
              printf "GLIBC versions:\n%s\n" "${glibc_versions}"
              max_glibc="$(printf "%s\n" "${glibc_versions}" | sort -V | tail -n 1)"
              if [[ "$(printf "2.17\n%s\n" "${max_glibc}" | sort -V | tail -n 1)" != "2.17" ]]; then
                printf "linux ${GOARCH} binary requires GLIBC_%s, expected GLIBC_2.17 or older\n" "${max_glibc}" >&2
                exit 1
              fi
            '
      - name: Stage archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail
          archive_dir="dist/${TARGET}/archive"
          archive_name="castctl_${RELEASE_VERSION}_linux_${ASSET_ARCH}.tar.gz"
          test -s LICENSE && test -s LICENSE.sing-box && test -s NOTICE && test -s README.md
          cp LICENSE LICENSE.sing-box NOTICE README.md "$archive_dir/"
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 -C "$archive_dir" -czf "dist/$archive_name" castctl LICENSE LICENSE.sing-box NOTICE README.md
          echo "ARCHIVE_NAME=${archive_name}" >> "${GITHUB_ENV}"
      - name: Upload release asset
        if: ${{ success() && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish != 'none')) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          ARCHIVE_NAME: ${{ env.ARCHIVE_NAME }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" "dist/${ARCHIVE_NAME}" --clobber

  build-linux-no-plugin:
    name: build linux-${{ matrix.goarch }} no-plugin
    runs-on: ubuntu-latest
    needs: prepare
    # See build-linux-glibc: dry runs build, a failed prepare
    # fail-closes publishing.
    if: ${{ always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64-no-plugin
            goarch: amd64
            asset_arch: amd64
          - target: linux-arm64-no-plugin
            goarch: arm64
            asset_arch: arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          # Go module/build cache only. Cache is NOT artifact storage:
          # nothing is stored as a downloadable run artifact and no
          # release asset is produced through it.
          cache: true
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          # inputs.* exist only on workflow_dispatch (and
          # workflow_call, which this workflow has no trigger
          # for). On any other event they expand empty; force
          # the dry-run values explicitly instead of relying on
          # that empty expansion plus the -n check in the elif
          # below.
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            INPUT_PUBLISH="none"
            INPUT_TAG_NAME=""
          fi
          # Reproducible-archive mtime: the commit time of HEAD
          # (fetch-depth: 0 in both build jobs, so the history
          # is present). No SOURCE_DATE_EPOCH is set anywhere
          # in the repo or by the runner; derive it, do not
          # invent it. Fail closed if it is not numeric.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)"
          if [[ ! "${SOURCE_DATE_EPOCH}" =~ ^[0-9]+$ ]]; then
            echo "could not derive SOURCE_DATE_EPOCH from commit time" >&2
            exit 1
          fi
          echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" >> "${GITHUB_ENV}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
            RELEASE_TAG="${GITHUB_REF_NAME}"
          elif [[ "${INPUT_PUBLISH}" != "none" && -n "${INPUT_TAG_NAME}" ]]; then
            RELEASE_VERSION="${INPUT_TAG_NAME#v}"
            RELEASE_TAG="${INPUT_TAG_NAME}"
          else
            # Dry-run: never a real version. Real versions are X.Y.Z
            # derived from vX.Y.Z tags and never contain "dispatch";
            # dry-run archives are never uploaded either.
            RELEASE_VERSION="0.0.0-dispatch-$(git rev-parse --short HEAD)"
            RELEASE_TAG=""
          fi
          # Defense in depth: repeat prepare's tag-format validation
          # for the effective tag. The dry-run branch sets
          # RELEASE_TAG="" and must NOT be validated (an empty
          # tag_name with publish=none takes the dry-run version
          # path above).
          if [[ -n "${RELEASE_TAG}" ]]; then
            if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "invalid release tag: ${RELEASE_TAG} (expected vX.Y.Z[-suffix])" >&2
              exit 1
            fi
          fi
          {
            echo "RELEASE_VERSION=${RELEASE_VERSION}"
            echo "RELEASE_TAG=${RELEASE_TAG}"
            echo "COMMIT=$(git rev-parse --short HEAD)"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "${GITHUB_ENV}"
        env:
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail
          archive_dir="dist/${TARGET}/archive"
          archive_name="castctl_${RELEASE_VERSION}_linux_${ASSET_ARCH}_no-plugin.tar.gz"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir"
          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go build -buildvcs=false -trimpath \
            -tags with_utls,with_quic,with_wireguard,with_gvisor \
            -ldflags="-s -w -X github.com/thoitiettxl-cyber/castctl/internal/commands.Version=${RELEASE_VERSION} -X github.com/thoitiettxl-cyber/castctl/internal/commands.Commit=${COMMIT} -X github.com/thoitiettxl-cyber/castctl/internal/commands.BuildDate=${BUILD_DATE}" \
            -o "$archive_dir/castctl" ./cmd/castctl/
          # Stamping verification: `go build -X` to a nonexistent var
          # exits 0 and silently drops the assignment, so verify the
          # stamped values in the just-built binary before the gate
          # and tar. The amd64 leg runs natively; the arm64 leg is
          # cross-built on an amd64 runner and cannot execute, so it
          # checks the stamped strings in the binary instead.
          if [[ "${GOARCH}" == "amd64" ]]; then
            version_output="$("$archive_dir/castctl" --version)"
            if ! printf "%s\n" "${version_output}" | grep -Fq "castctl ${RELEASE_VERSION} (${COMMIT} "; then
              echo "stamping verification failed: got ${version_output}, expected castctl ${RELEASE_VERSION} (${COMMIT} ...)" >&2
              exit 1
            fi
            echo "stamping verified: ${version_output}"
          else
            command -v strings >/dev/null || { echo "strings not found" >&2; exit 1; }
            if ! strings "$archive_dir/castctl" | grep -Fq "${RELEASE_VERSION}" || ! strings "$archive_dir/castctl" | grep -Fq "${COMMIT}" || ! strings "$archive_dir/castctl" | grep -Fq "${BUILD_DATE}"; then
              echo "stamping verification failed: strings in binary do not contain ${RELEASE_VERSION}, ${COMMIT} and ${BUILD_DATE}" >&2
              exit 1
            fi
            echo "stamping verified via strings: ${RELEASE_VERSION} ${COMMIT} ${BUILD_DATE}"
          fi
          command -v readelf >/dev/null || { echo "readelf not found" >&2; exit 1; }
          if readelf -l "$archive_dir/castctl" | grep -q 'Requesting program interpreter'; then
            readelf -l "$archive_dir/castctl" >&2
            echo "no-plugin linux binary must not require a dynamic interpreter" >&2
            exit 1
          fi
          echo "no-plugin gate passed: no program interpreter requested"
          test -s LICENSE && test -s LICENSE.sing-box && test -s NOTICE && test -s README.md
          cp LICENSE LICENSE.sing-box NOTICE README.md "$archive_dir/"
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 -C "$archive_dir" -czf "dist/$archive_name" castctl LICENSE LICENSE.sing-box NOTICE README.md
          echo "ARCHIVE_NAME=${archive_name}" >> "${GITHUB_ENV}"
      - name: Upload release asset
        if: ${{ success() && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish != 'none')) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          ARCHIVE_NAME: ${{ env.ARCHIVE_NAME }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" "dist/${ARCHIVE_NAME}" --clobber

  checksums:
    name: publish checksums
    runs-on: ubuntu-latest
    needs: [build-linux-glibc, build-linux-no-plugin]
    # SUCCESS-ONLY, deliberately not upstream's `if: always()`: a run
    # with a failed arch must not publish a checksums.txt covering
    # only the surviving archives. Both build jobs must have fully
    # succeeded AND the publish predicate must hold; a default
    # dispatch dry-run skips this job cleanly (not failed).
    if: ${{ needs.build-linux-glibc.result == 'success' && needs.build-linux-no-plugin.result == 'success' && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish != 'none')) }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Derive release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="${INPUT_TAG_NAME}"
          fi
          # Same tag-format validation as prepare (defense in depth;
          # this job only runs on the publish path, so a dry run
          # never reaches this check).
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: ${RELEASE_TAG} (expected vX.Y.Z[-suffix])" >&2
            exit 1
          fi
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
      - name: Download release assets and write sorted checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist
          gh release download "${RELEASE_TAG}" --pattern 'castctl_*.tar.gz' --dir dist
          # Fail-closed count check: exactly the 4 archives. The count
          # catches partial sets that a bare download success would not.
          count="$(ls dist/castctl_*.tar.gz 2>/dev/null | wc -l || true)"
          if [[ "${count}" != "4" ]]; then
            echo "expected 4 release archives, found ${count}" >&2
            ls -la dist/ >&2
            exit 1
          fi
          (cd dist && sha256sum castctl_*.tar.gz | sort -k2 > checksums.txt)
          cat dist/checksums.txt
      - name: Upload checksums.txt
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" dist/checksums.txt --clobber
