# castctl release binary (primary, glibc build). Hashes re-verified by
# real download against the release checksums.txt on 2026-10-31.
LOCK_CASTCTL_VERSION=0.6.4
LOCK_CASTCTL_ARCHIVE=castctl_0.6.4_linux_arm64.tar.gz
