[package]
name = "castctl-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command table, flag parsing, help/usage rendering, and exit mapping ported from castctl's Go internal/commands (M2, offline surface only)"

[dependencies]
castctl-approvals = { path = "../castctl-approvals" }
castctl-config = { path = "../castctl-config" }
# M7b PR-3: `auth list` renders `deliver`'s profile list.
castctl-deliver = { path = "../castctl-deliver" }
castctl-fsclient = { path = "../castctl-fsclient" }
castctl-gateway = { path = "../castctl-gateway" }
# M7b PR-3: `auth status` reads keeper expiry/state, `auth
# import` writes through the keeper cookie lock + reset.
castctl-keeper = { path = "../castctl-keeper" }
castctl-logging = { path = "../castctl-logging" }
castctl-shared = { path = "../castctl-shared" }
castctl-telegram = { path = "../castctl-telegram" }
castctl-transport = { path = "../castctl-transport" }
# M7b PR-3: `update` runs the update crate.
castctl-update = { path = "../castctl-update" }
castctl-wait = { path = "../castctl-wait" }
castctl-webui = { path = "../castctl-webui" }
# M6c-b: `plugin check` runs the real Rust loader
# through `Host::apply_config` (see `run.rs`
# `cmd_plugin`).
castctl-pluginhost = { path = "../castctl-pluginhost" }
chrono = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "signal"] }
