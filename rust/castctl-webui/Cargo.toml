[package]
name = "castctl-webui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Web UI HTTP server for the castctl Rust port (M6b): loopback-only, bcrypt Bearer auth, /api/v1 management API + embedded frontend shell, ported from internal/webui and internal/commands/webui.go. Screencast is seam-only (the keeper crate landed in M6a, but the webui does not wire it yet — see PORTING.md §M6b.7); chats are seam-only until a gateway runtime is wired."

[dependencies]
castctl-config = { path = "../castctl-config" }
castctl-log-redact = { path = "../castctl-log-redact" }
# Fix loop 1, B1/B5: the shared Go-RFC3339Nano renderer
# and TZif offset lookup (one implementation for the
# keeper and webui render/parse sites).
castctl-shared = { path = "../castctl-shared" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
tokio-tungstenite = { workspace = true }
bcrypt = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
libc = { workspace = true }
regex = { workspace = true }
futures-util = { workspace = true }
futures-core = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, default-features = false, features = ["clock", "std"] }
# NO axum, NO tower, NO mime, NO rust-embed, NO fs2 (see
# rust/PORTING.md §M6b D1/D3 and research-rust-workspace.md).
# NO castctl-transport (client-side; the server is plaintext
# loopback) and NO castctl-gateway (chats go through the
# injected ChatDeps trait, not a hard dependency).

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
