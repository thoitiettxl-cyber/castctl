[package]
name = "castctl-telegram"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Telegram bot core for the castctl Rust port (M5a): hand-rolled getUpdates long polling, dispatcher, 30-command routing table, state file, approvals and claims, ported from internal/telegram and internal/commands/telegram*.go. Turn streaming is M5b (seam only)."

[dependencies]
castctl-approvals = { path = "../castctl-approvals" }
castctl-config = { path = "../castctl-config" }
castctl-gateway = { path = "../castctl-gateway" }
castctl-log-redact = { path = "../castctl-log-redact" }
castctl-shared = { path = "../castctl-shared" }
castctl-tg-files = { path = "../castctl-tg-files" }
castctl-tg-text = { path = "../castctl-tg-text" }
castctl-transport = { path = "../castctl-transport" }
# The wait core's safety/gate regexes are Go RE2 patterns
# (`internal/wait/reason.go`); the `regex` crate is the
# RE2-family equivalent, already a workspace dependency
# and already in `Cargo.lock`, so this adds zero new
# crates to the lock.
regex = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
# Callback tokens use `crypto/rand` parity (Go
# `internal/telegram/approvals.go:285-341`): `rand` is
# already a workspace dependency (used by
# `castctl-gateway`) and already in `Cargo.lock`, so this
# adds zero new crates to the lock (fix loop 1, safety
# B1 / tech B7).
rand = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
