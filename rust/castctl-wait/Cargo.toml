[package]
name = "castctl-wait"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Wait runner: boundary derivation, chat.subscribe loop, and endgame (port of Go internal/wait runner/history/clock)"

[dependencies]
castctl-approvals = { path = "../castctl-approvals" }
castctl-gateway = { path = "../castctl-gateway" }
castctl-logging = { path = "../castctl-logging" }
castctl-shared = { path = "../castctl-shared" }
castctl-telegram = { path = "../castctl-telegram" }
castctl-transport = { path = "../castctl-transport" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
