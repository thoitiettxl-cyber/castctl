[package]
name = "castctl-shared"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "History-event resource shaping ported from castctl's Go internal/shared/resources.go and values.go (M1, pure logic only)"

[dependencies]
regex.workspace = true
# M4b: local-time rendering (see timefmt.rs) + the
# serde_json -> JsonValue bridge for gateway values
# (bridge.rs). Both are already pinned in Cargo.lock
# (chrono via honk-config, serde_json workspace-wide);
# no new crate enters the tree.
chrono = { workspace = true, default-features = false, features = ["clock", "std"] }
serde_json = { workspace = true }
