[package]
name = "castctl-transport"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Transport glue for the castctl Rust port (M3): outbound dispatch via honk-outbound, HTTP-over-outbound client, gateway RPC client call_json, retry policy ported from internal/conn. Protocols are NOT reimplemented here; honk-outbound is called as a dependency."

[dependencies]
honk-outbound = { workspace = true, features = ["rprx"] }
honk-config = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
# M3d: boringtun (Noise/IK, no `device` feature — no TUN device)
# + smoltcp (userspace TCP/IP; minimal feature set, see below)
# + base64 (strict Std decoding of WireGuard key strings).
boringtun = { workspace = true, default-features = false }
base64 = { workspace = true }
smoltcp = { workspace = true, default-features = false, features = ["std", "log", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "socket-tcp-cubic", "async"] }
# M4b: HTTPS over an outbound (rustls + tokio-rustls +
# webpki-roots; all already in Cargo.lock via
# tokio-tungstenite — no new crate). The provider selection
# (`ring` only, no default features) lives on the workspace
# dep (see rust/Cargo.toml): enabling a second provider
# makes ClientConfig::builder() panic at runtime.
rustls = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
# Test-only: lets integration tests drive HttpClient directly
# (its request method takes http::Method). Already pinned in the
# workspace and in Cargo.lock; no new dependency is introduced.
http = { workspace = true }
# Test-only: lets integration tests implement Dialer (whose stream
# type is honk's AsyncReadWrite) with counting wrappers.
honk-outbound = { workspace = true, features = ["rprx"] }
# Test-only (M3d): the integration test builds its own in-process
# boringtun peer + smoltcp server stack, so it needs the same
# libraries the dialer uses. Already pinned in the workspace and
# in Cargo.lock; no new dependency is introduced.
boringtun = { workspace = true, default-features = false }
base64 = { workspace = true }
smoltcp = { workspace = true, default-features = false, features = ["std", "log", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "socket-tcp-cubic", "async"] }
