[workspace]
members = [
    "castctl-tg-text",
    "castctl-tg-files",
    "castctl-shared",
    "castctl-log-redact",
    "castctl-config",
    "castctl-cli",
    "castctl-transport",
    "castctl-gateway",
    "castctl-telegram",
    "castctl-update",
    "castctl-pluginhost",
    "castctl-rs",
    "castctl-keeper",
]
resolver = "2"

[workspace.package]
edition = "2024"
# M3c: the real MSRV is 1.98 — honk pulls aya 0.16.0 via
# honk-ebpf-common, and aya 0.16 requires rustc >= 1.98. The
# previous "1.85" was the M3 submission value, never re-checked
# against the honk dependency graph; a 1.97.1-only machine fails
# the build before compiling anything (see PORTING.md §M3.9).
rust-version = "1.98"
# M3: the Rust artifact links honk-outbound (GPL-3.0-only), so the
# Rust artifact is GPL-3.0-only. The Go binary stays GPL-3.0-or-later;
# two artifacts, two licenses (Boss decision, quoted verbatim in
# rust/NOTICE and docs/provenance.md §13).
license = "GPL-3.0-only"

[workspace.dependencies]
# regex is the sole dependency of the M1 workspace. Reason: Go's
# regexp package is RE2; the Rust `regex` crate is the RE2-family
# analogue and the in-scope patterns (fence/link/heading/stash/tag,
# doc-name, sandbox link, redaction vocabularies) use only
# constructs it supports (no backreferences, no lookaround).
# Pinned exactly after measurement on cue (rustc 1.97.1).
regex = "=1.13.1"
# M3: honk-outbound is the transport engine (called, not copied).
# Pinned by git rev; see [patch.crates-io] below — honk's own patch
# table does NOT propagate to a git dependency, so the workspace root
# must replicate it, otherwise boring-sys/quinn resolve to crates.io
# and the REALITY/QUIC fork hooks are silently lost.
# M4c: the Chrome-parity fork (thoitiettxl-cyber/honk,
# feat/chrome-tls-parity) was tried and REVERTED — the live 502
# is not a TLS fingerprint (see rust/PORTING.md §M4c). Upstream
# pin restored.
honk-outbound = { git = "https://github.com/daeuniverse/honk", rev = "9e31cc0bd28825afdc0e384dc989bc3f076e69cf" }
honk-config = { git = "https://github.com/daeuniverse/honk", rev = "9e31cc0bd28825afdc0e384dc989bc3f076e69cf" }
# M3 HTTP/RPC stack versions are pinned exactly after the first cue
# build resolves them (see rust/PORTING.md §M3); the pins below are
# filled in by the M3 writer from the committed Cargo.lock.
tokio = "=1.48.0"
serde = "=1.0.228"
# M3c: `arbitrary_precision` keeps JSON numbers as literals
# (Go `json.Number` parity) instead of losing numbers outside
# i64/u64 to float64 rounding — without it, a gateway number
# above u64::MAX silently changed value on decode.
serde_json = { version = "=1.0.145", features = ["arbitrary_precision"] }
hyper = "=1.8.1"
# M3b: canonical hyper<->tokio IO adapter (TokioIo), resolved
# on cue to 0.1.20 (see rust/PORTING.md §M3.7).
hyper-util = "=0.1.20"
http = "=1.3.1"
http-body-util = "=0.1.3"
bytes = "=1.11.0"
# M3d: strict Std-base64 decoding for WireGuard keys (already in
# the lock via boringtun; no new crate enters the tree).
base64 = "=0.22.1"
# M3d (provisional pins D10, confirmed on cue — see
# rust/PORTING.md §M3d): boringtun = userspace WireGuard
# Noise/IK handshake, smoltcp = userspace TCP/IP stack.
boringtun = "=0.7.1"
smoltcp = "=0.14.0"
# M4a: Noise XX gateway crypto (snow), protobuf (prost family),
# WebSocket (tokio-tungstenite), randomness for chunk ids (rand).
# All pinned exactly after measurement on cue (see
# rust/PORTING.md §M4a); snow 0.10.0 / prost 0.14.4 /
# tokio-tungstenite 0.30.0 / rand 0.10.3 are the latest on
# crates.io at pin time (cargo search, 2026-11-05).
snow = "=0.10.0"
prost = "=0.14.4"
prost-build = "=0.14.4"
prost-types = "=0.14.4"
tokio-tungstenite = "=0.30.0"
rand = "=0.10.3"
# M4b: local-time rendering (`threads.updated`,
# `usage.resets_at`, `UsageLines` TZ abbreviation) via
# chrono::Local (real tzdata, matching Go `time.Local`).
# chrono 0.4.45 is already in Cargo.lock via honk-config;
# promoting it adds no new crate. Features are minimal:
# `clock` (Local) + `std`; no `serde`, no `wasmbind`.
chrono = "=0.4.45"
# M4b: HTTPS over an outbound (FetchSessionInfo /
# FetchAccessToken / FetchHatchToken / FetchSubscription):
# rustls + tokio-rustls + webpki-roots (Mozilla roots).
# All three are already in Cargo.lock via tokio-tungstenite
# 0.30.0 (rustls 0.23.46 with ring, tokio-rustls 0.26.6,
# webpki-roots 0.26.11); promoting them adds no new crate.
# DEFAULT FEATURES ARE OFF on purpose: rustls's default is
# `aws_lc_rs` and tokio-rustls's default is `aws_lc_rs` too;
# enabling either alongside `ring` makes
# `CryptoProvider::from_crate_features()` ambiguous and
# `ClientConfig::builder()` panics at runtime (measured
# 2026-11-05: both providers enabled -> "Could not
# automatically determine the process-level CryptoProvider").
# The only provider is `ring`, matching tokio-tungstenite's
# selection; `aws-lc-rs` must never enter the lock.
rustls = { version = "=0.23.46", default-features = false, features = ["logging", "ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["logging", "ring", "tls12"] }
webpki-roots = "=0.26.11"
# M6c: SHA-256 / hex / temp files / file lock. All already in
# Cargo.lock (sha2 0.10.9 via snow, hex 0.4.3 via boringtun,
# tempfile 3.27.0 via prost-build, libc 0.2.191); promoting them
# adds no new crate. sha2 0.10.9 (not 0.11.1) is the
# workspace-consistent line: M6a and M6b both pinned it, and
# 0.11.1 exists only via honk-outbound (digest 0.11). After
# promoting, `cargo tree -d` must show no duplicate sha2/digest
# introduced by the M6c crates.
sha2 = "=0.10.9"
hex = "=0.4.3"
tempfile = "=3.27.0"
libc = "=0.2.191"
# M6c: tar + flate2 are the ONLY new crates (measured on cue
# 2026-11-05 in a scratch probe dir: `cargo add tar flate2`
# resolved tar 0.4.46 / flate2 1.1.10, checksums
# 3f6221d9a6003c78398e3b239969f352578258df48c8eb051caadae0015bc840
# / 6e634e2e0ebac1ee034020da1ca582e17ffe4e0f5e985823721e168928136dcb;
# transitive miniz_oxide 0.9.1 + zlib-rs 0.6.8 + crc32fast 1.5.4
# already in the lock). Default features: flate2's rust_backend
# (miniz_oxide/zlib-rs), no system zlib.
tar = "=0.4.46"
flate2 = "=1.1.10"
# reader/writer halves (tokio-tungstenite only re-exports the
# concrete stream type; the traits must be direct deps).
futures-core = "=0.3.34"
futures-sink = "=0.3.34"
futures-util = "=0.3.34"
# M6a: keeper workspace deps. All four are already in
# Cargo.lock (url via tokio-tungstenite, libc via
# tokio-tungstenite/hyper, async-trait via a transitive dep,
# sha2 via honk-outbound); promoting them adds no new crate.
url = "=2.5.8"
libc = "=0.2.191"
async-trait = "=0.1.92"
sha2 = "=0.10.9"

[patch.crates-io]
# Replicated verbatim from honk's workspace Cargo.toml at the pinned
# rev (required: see the comment on honk-outbound above).
boring-sys = { git = "https://github.com/Glassyiris/boring-sys", rev = "3beb573b65ecaa69b7eefe3c2fecd074b97facd2" }
quinn = { git = "https://github.com/Glassyiris/quinn", rev = "11f1de84c28305a3c98ace6d681c35219a8d1e6c" }
quinn-proto = { git = "https://github.com/Glassyiris/quinn", rev = "11f1de84c28305a3c98ace6d681c35219a8d1e6c" }
