[package]
name = "castctl-update"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Self-update for the castctl Rust port (M6c): hand-rolled semver, checksums parsing, tar.gz extraction, ELF validation, safe replace (flock + temp + rename + fsync), exec check, and the release-selection / download / verify flow, ported from internal/update."

[dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
libc = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Integration tests use the same crates as the lib (tar
# builder, checksums hex, sha256): integration tests can
# only see dev-dependencies, not the lib's own deps.
hex = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
sha2 = { workspace = true }
