[package]
name = "castctl-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Gateway transport for the castctl Rust port (M4a): WebSocket + Noise XX (snow) + protobuf (prost) client ported from internal/gateway and internal/conn. Protocols are NOT reimplemented: Noise crypto comes from the snow crate, protobuf types are generated by prost-build from the repo's own FileDescriptorProto binaries (internal/proto/desc0.bin, desc1.bin); only the framing/envelope/SharedConn logic around them is castctl code."

[dependencies]
castctl-transport = { path = "../castctl-transport" }
# M4b: order-preserving JSON (decode_ordered_json) for the
# cookie-file parser only — the gateway uses the config
# crate's JSON value model, never its config loading.
castctl-config = { path = "../castctl-config" }
# M4b: regex for the subscription bundle scan (FindActionID);
# http::Method/HeaderMap + bytes::Bytes for the HTTPS
# side-paths (doHatch/callAction). All already in the lock.
regex = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
# M4b: base64 for the Sec-WebSocket-Key. The manual TLS
# wrap in dial.rs uses `castctl_transport::rustls_tls_wrap`
# (restored in M4c step 3 — the honk swap is gone; the live
# matrix proved the token decides, not the fingerprint), so
# this crate has no tokio-rustls dep. Both already in the
# lock.
base64 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
serde_json = { workspace = true }
snow = { workspace = true }
prost = { workspace = true }
# tokio-tungstenite default features are connect+handshake only
# (no TLS); wss:// dial needs rustls-tls-webpki-roots. The WS
# upgrade is written by hand in dial.rs (M4b), so tungstenite
# is used only for WS framing (`from_partially_read`) +
# `derive_accept_key`; the TLS wrap uses
# `castctl_transport::rustls_tls_wrap`, which pins ALPN
# ["http/1.1"] for BOTH dials, matching Go (see dial.rs).
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
rand = { workspace = true }
futures-core = { workspace = true }
futures-sink = { workspace = true }
futures-util = { workspace = true }

[build-dependencies]
# prost is needed in build.rs itself (Message::decode for the
# FileDescriptorProto bins), not only at runtime.
prost = { workspace = true }
prost-build = { workspace = true }
prost-types = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
snow = { workspace = true }
tokio-tungstenite = { workspace = true }
