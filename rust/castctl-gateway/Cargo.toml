[package]
name = "castctl-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Gateway transport for the castctl Rust port (M4a): WebSocket + Noise XX (snow) + protobuf (prost) client ported from internal/gateway and internal/conn. Protocols are NOT reimplemented: Noise crypto comes from the snow crate, protobuf types are generated by prost-build from the repo's own FileDescriptorProto binaries (internal/proto/desc0.bin, desc1.bin); only the framing/envelope/SharedConn logic around them is castctl code."

[dependencies]
castctl-transport = { path = "../castctl-transport" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
serde_json = { workspace = true }
snow = { workspace = true }
prost = { workspace = true }
# tokio-tungstenite default features are connect+handshake only
# (no TLS); wss:// dial needs rustls-tls-webpki-roots. Go pins
# ALPN ["http/1.1"] for the WS dial; the rustls client used
# here sends NO ALPN by default, so the server cannot
# negotiate h2 and the upgrade stays HTTP/1.1 — same wire
# outcome, different mechanism (see dial.rs + PORTING.md §M4a).
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
rand = { workspace = true }
futures-core = { workspace = true }
futures-sink = { workspace = true }
futures-util = { workspace = true }

[build-dependencies]
# prost is needed in build.rs itself (Message::decode for the
# FileDescriptorProto bins), not only at runtime.
prost = { workspace = true }
prost-build = { workspace = true }
prost-types = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
snow = { workspace = true }
tokio-tungstenite = { workspace = true }
